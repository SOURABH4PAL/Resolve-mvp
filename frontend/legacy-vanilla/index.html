<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ResolveHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2 style="margin-bottom: 0.5rem; text-align: center; color: #1e293b;">ResolveHub Login</h2>
      <p style="text-align: center; color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.9rem;">Sign in to your account</p>
      
      <div id="alert-box"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" required placeholder="e.g. employee@resolvehub.com">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
      </form>

      <div style="margin-top: 1.5rem; background: #f1f5f9; padding: 0.75rem; border-radius: 6px; font-size: 0.8rem; color: #475569;">
        <strong>Demo Accounts:</strong><br>
        • Employee: <code>employee@resolvehub.com</code> / <code>Employee123!</code><br>
        • Resolver: <code>resolver@resolvehub.com</code> / <code>Resolver123!</code><br>
        • Admin: <code>admin@resolvehub.com</code> / <code>Admin123!</code>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    if (getToken()) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const alertBox = document.getElementById('alert-box');
      alertBox.innerHTML = '';

      try {
        const res = await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        if (res.ok) {
          const data = await res.json();
          setAuth(data.access_token, {
            id: data.user_id,
            name: data.name,
            role: data.role
          });
          window.location.href = 'dashboard.html';
        } else {
          const err = await res.json();
          alertBox.innerHTML = `<div class="alert alert-danger">${err.detail || 'Login failed'}</div>`;
        }
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-danger">Network error: Unable to connect to server</div>`;
      }
    });
  </script>
</body>
</html>
