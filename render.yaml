services:
  - type: web
    name: resolvehub-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python populate_dailoqa_data.py && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONPATH
        value: ".:backend"
      - key: DATABASE_URL
        sync: false
